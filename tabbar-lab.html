<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2f2f7">
<title>Laboratório da barra inferior</title>
<script src="./v04navicons.js?v=0.4.26"></script>
<style>
:root{--bg:#f2f2f7;--card:#fff;--surface:#fff;--text:#111114;--muted:#6e6e73;--line:rgba(60,60,67,.14);--accent:#3478f6;--soft:rgba(120,120,128,.09)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;-webkit-font-smoothing:antialiased}body.dark{--bg:#09090b;--card:#1c1c1e;--surface:#1c1c1e;--text:#f7f7fa;--muted:#a1a1a6;--line:rgba(255,255,255,.10);--soft:rgba(255,255,255,.07)}button,input,select{font:inherit}button{-webkit-tap-highlight-color:transparent}.app{width:min(100%,520px);margin:auto;padding:calc(10px + env(safe-area-inset-top)) 12px calc(26px + env(safe-area-inset-bottom))}.header{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;margin-bottom:10px}.header h1{font-size:22px;line-height:1.1;margin:0;text-align:center}.header small{display:block;font-size:10px;color:var(--muted);margin-top:3px;text-align:center}.round{width:40px;height:40px;border:0;border-radius:14px;background:var(--card);color:var(--text);font-size:24px;box-shadow:0 2px 9px rgba(0,0,0,.06)}.theme{border:0;border-radius:13px;background:var(--card);color:var(--text);padding:10px 11px;font-size:11px;font-weight:700;box-shadow:0 2px 9px rgba(0,0,0,.06)}.preview-card{position:sticky;top:calc(6px + env(safe-area-inset-top));z-index:20;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:9px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.10)}.preview{height:158px;position:relative;overflow:hidden;border-radius:17px;background:var(--bg);border:1px solid var(--line)}.preview-copy{position:absolute;left:13px;top:12px}.preview-copy strong{display:block;font-size:13px}.preview-copy small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.fake{position:absolute;top:46px;left:12px;right:12px;display:grid;grid-template-columns:1fr 1fr;gap:8px}.fake div{height:62px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}.bar{position:absolute;display:grid;z-index:3;isolation:isolate}.bubble{position:absolute;z-index:0;pointer-events:none}.tab{z-index:1;border:0;background:transparent;color:inherit;padding:0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center}.tab>span{display:grid;place-items:center;line-height:0}.tab svg{display:block;width:100%;height:100%;overflow:visible;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.tab small{line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}.actions button{border:0;border-radius:13px;padding:11px 9px;font-size:12px;font-weight:750}.secondary{background:var(--soft);color:var(--text)}.primary{background:var(--accent);color:white}.section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:11px}.section h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 10px}.control{padding:8px 0;border-bottom:1px solid var(--line)}.control:last-child{border-bottom:0}.control-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}.control label{font-size:13px;font-weight:680}.value{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}.control input[type=range]{width:100%;height:30px;margin:0;accent-color:var(--accent)}.color-control{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}.color-control:last-child{border-bottom:0}.color-control label{font-size:13px;font-weight:680}.color-control input{width:46px;height:32px;border:0;padding:0;background:transparent}.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}.switch{width:48px;height:29px;border:0;border-radius:999px;background:#8e8e93;padding:2px}.switch span{display:block;width:25px;height:25px;border-radius:50%;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.22);transition:transform .15s}.switch.on{background:#34c759}.switch.on span{transform:translateX(19px)}select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--text);padding:10px 11px}.code{width:100%;min-height:190px;border:1px solid var(--line);border-radius:13px;background:var(--bg);color:var(--text);font:10px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;padding:10px;resize:vertical}.footer-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.footer-actions button{border:0;border-radius:14px;padding:12px;font-size:12px;font-weight:750}.wide{grid-column:1/-1}.toast{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));z-index:50;transform:translate(-50%,10px);opacity:0;background:#1c1c1e;color:#fff;border-radius:12px;padding:9px 12px;font-size:11px;transition:.16s;pointer-events:none}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main class="app">
  <header class="header">
    <button class="round" id="backBtn" aria-label="Voltar">‹</button>
    <div><h1>Barra inferior</h1><small>Editor leve · 0.4.26</small></div>
    <button class="theme" id="themeBtn">Escuro</button>
  </header>

  <section class="preview-card">
    <div class="preview" id="preview">
      <div class="preview-copy"><strong>Prévia ao vivo</strong><small>Toque em uma aba para testar a bolha</small></div>
      <div class="fake"><div></div><div></div></div>
      <nav class="bar" id="bar" aria-label="Prévia da barra"><span class="bubble" id="bubble"></span></nav>
    </div>
    <div class="actions"><button class="secondary" id="reloadBtn">Carregar do app</button><button class="primary" id="applyBtn">Aplicar</button></div>
  </section>

  <section class="section"><h2>Geometria</h2><div id="geometry"></div></section>
  <section class="section"><h2>Fundo e vidro</h2><div id="backgroundControls"></div></section>
  <section class="section"><h2>Borda e sombra</h2><div id="shadowControls"></div></section>
  <section class="section"><h2>Bolha selecionada</h2><div id="bubbleControls"></div></section>
  <section class="section"><h2>Ícones e textos</h2><div id="itemControls"></div></section>
  <section class="section"><h2>Movimento</h2><div id="motionControls"></div></section>
  <section class="section">
    <h2>Configuração</h2>
    <textarea class="code" id="code" readonly></textarea>
    <div class="footer-actions" style="margin-top:8px">
      <button class="secondary" id="resetBtn">Restaurar padrão</button>
      <button class="secondary" id="copyBtn">Copiar código</button>
      <button class="primary wide" id="applyBackBtn">Aplicar e voltar ao app</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<script>
const SETTINGS_KEY='registro-settings-v2',PRESET='light-v2-20260830-1703';
const DARK={barWidth:95,barHeight:52,bottomOffset:10,barPadding:1,barRadius:80,barX:0,barOpacity:.11,barColor:'#ffffff',blur:2,saturation:260,brightness:105,barBorderWidth:.5,barBorderOpacity:.12,barBorderColor:'#ffffff',shadowOpacity:.19,shadowBlur:16,shadowY:8,shadowSpread:2,shadowColor:'#000000',bubbleWidth:.99,bubbleHeight:.99,bubbleX:0,bubbleY:0,bubbleOpacity:.5,bubbleColor:'#adadad',bubbleRadius:80,bubbleBorderWidth:1.25,bubbleBorderOpacity:.15,bubbleBorderColor:'#ffffff',bubbleShadowOpacity:.14,bubbleShadowBlur:10,bubbleShadowY:-1,iconSize:31,activeScale:1.32,iconY:-1,textSize:8,textWeight:650,itemGap:1,hideLabels:true,activeColor:'#000000',inactiveColor:'#ffffff',animateTabs:true,animationDuration:740,easing:'spring',pressScale:1,inactiveOpacity:.48};
const LIGHT={...DARK,bubbleOpacity:.25,bubbleColor:'#74a7ff',iconSize:28,activeColor:'#000000',inactiveColor:'#000000',animationDuration:350,pressScale:.78,inactiveOpacity:.61};
const CURVES={spring:'cubic-bezier(.18,1.35,.35,1)',ios:'cubic-bezier(.2,.8,.2,1)',snappy:'cubic-bezier(.22,.7,.2,1)',ease:'ease',linear:'linear'};
const TABS=[['home','Início'],['history','Histórico'],['chart','Análises'],['spark','Aprendizado'],['settings','Ajustes']];
const $=id=>document.getElementById(id);let theme='light',selected=0,state={},raf=0;
function settings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return{}}}
function base(){return theme==='dark'?DARK:LIGHT}
function rgba(hex,a){const n=parseInt(String(hex).replace('#',''),16)||0;return`rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`}
function toast(text){const t=$('toast');t.textContent=text;t.classList.add('show');clearTimeout(t._x);t._x=setTimeout(()=>t.classList.remove('show'),1100)}
function currentTheme(){const s=settings();if(s.theme==='dark'||s.theme==='light')return s.theme;return matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'}
function navIcon(key){const s=settings(),o=s.iconOverrides?.[key];if(o?.type==='svg'&&o.value){const m=String(o.value).replace(/<script[\s\S]*?<\/script>/gi,'').match(/<svg[^>]*>([\s\S]*?)<\/svg>/i);return m?m[1]:o.value}if(o?.type==='bank'&&window.REGISTRO_NAV_ICONS?.[o.value])return window.REGISTRO_NAV_ICONS[o.value];return window.REGISTRO_NAV_ICONS?.[key]||''}
function loadFromApp(nextTheme=theme){theme=nextTheme;const s=settings(),stored=s.tabBarStyles?.[theme]||{};state={...base(),...stored};document.body.classList.toggle('dark',theme==='dark');$('themeBtn').textContent=theme==='dark'?'Claro':'Escuro';buildTabs();buildControls();render();toast('Configuração carregada')}
function buildTabs(){const bar=$('bar');bar.innerHTML='<span class="bubble" id="bubble"></span>';TABS.forEach(([key,label],i)=>{const b=document.createElement('button');b.className='tab';b.type='button';b.innerHTML=`<span><svg viewBox="0 0 24 24" aria-hidden="true">${navIcon(key)}</svg></span><small>${label}</small>`;b.onclick=()=>{selected=i;schedule()};bar.appendChild(b)})}
const groups={
geometry:[['barWidth','Largura',70,100,1,'%'],['barHeight','Altura',44,86,1,'px'],['bottomOffset','Distância inferior',2,34,1,'px'],['barPadding','Espaço interno',0,12,1,'px'],['barRadius','Arredondamento',12,80,1,'px'],['barX','Deslocamento horizontal',-20,20,1,'px']],
backgroundControls:[['barOpacity','Opacidade',.03,1,.01,''],['blur','Desfoque',0,40,1,'px'],['saturation','Saturação',50,260,5,'%'],['brightness','Brilho',60,150,1,'%']],
shadowControls:[['barBorderWidth','Borda',0,4,.25,'px'],['barBorderOpacity','Opacidade da borda',0,1,.01,''],['shadowOpacity','Sombra',0,.6,.01,''],['shadowBlur','Desfoque da sombra',0,50,1,'px'],['shadowY','Sombra vertical',-10,28,1,'px'],['shadowSpread','Expansão',-8,14,1,'px']],
bubbleControls:[['bubbleWidth','Largura relativa',.4,1,.01,''],['bubbleHeight','Altura relativa',.35,1,.01,''],['bubbleX','Deslocamento X',-12,12,1,'px'],['bubbleY','Deslocamento Y',-12,12,1,'px'],['bubbleOpacity','Opacidade',0,1,.01,''],['bubbleRadius','Arredondamento',8,80,1,'px'],['bubbleBorderWidth','Borda',0,4,.25,'px'],['bubbleBorderOpacity','Opacidade da borda',0,1,.01,''],['bubbleShadowOpacity','Sombra',0,.5,.01,''],['bubbleShadowBlur','Desfoque da sombra',0,30,1,'px'],['bubbleShadowY','Sombra vertical',-8,14,1,'px']],
itemControls:[['iconSize','Tamanho dos ícones',18,40,1,'px'],['activeScale','Escala selecionada',1,1.6,.01,'×'],['iconY','Posição vertical',-10,10,1,'px'],['textSize','Tamanho do texto',7,13,1,'px'],['textWeight','Peso do texto',400,800,50,''],['itemGap','Espaço ícone/texto',0,8,1,'px'],['inactiveOpacity','Opacidade inativa',.15,1,.01,'']],
motionControls:[['animationDuration','Duração',0,900,10,'ms'],['pressScale','Escala ao tocar',.7,1,.01,'×']]
};
function rangeHTML(key,label,min,max,step,unit){return`<div class="control"><div class="control-head"><label for="${key}">${label}</label><span class="value" id="v-${key}"></span></div><input id="${key}" data-key="${key}" type="range" min="${min}" max="${max}" step="${step}"></div>`}
function buildControls(){Object.entries(groups).forEach(([id,defs])=>{$(id).innerHTML=defs.map(d=>rangeHTML(...d)).join('')});$('backgroundControls').insertAdjacentHTML('beforeend',colorHTML('barColor','Cor da barra'));$('shadowControls').insertAdjacentHTML('beforeend',colorHTML('barBorderColor','Cor da borda')+colorHTML('shadowColor','Cor da sombra'));$('bubbleControls').insertAdjacentHTML('beforeend',colorHTML('bubbleColor','Cor da bolha')+colorHTML('bubbleBorderColor','Cor da borda'));$('itemControls').insertAdjacentHTML('beforeend',colorHTML('activeColor','Ícone selecionado')+colorHTML('inactiveColor','Ícones inativos')+toggleHTML('hideLabels','Ocultar textos'));$('motionControls').insertAdjacentHTML('beforeend',toggleHTML('animateTabs','Animar troca')+'<div class="control"><label for="easing">Curva</label><select id="easing"><option value="spring">Spring</option><option value="ios">iOS suave</option><option value="snappy">Rápida</option><option value="ease">Ease</option><option value="linear">Linear</option></select></div>');document.querySelectorAll('[data-key]').forEach(el=>{const key=el.dataset.key;el.value=state[key];el.oninput=()=>{state[key]=Number(el.value);schedule()}});document.querySelectorAll('[data-color]').forEach(el=>{const key=el.dataset.color;el.value=state[key];el.oninput=()=>{state[key]=el.value;schedule()}});document.querySelectorAll('[data-toggle]').forEach(el=>{const key=el.dataset.toggle;el.classList.toggle('on',!!state[key]);el.onclick=()=>{state[key]=!state[key];el.classList.toggle('on',!!state[key]);schedule()}});$('easing').value=state.easing||'spring';$('easing').onchange=()=>{state.easing=$('easing').value;schedule()}}
function colorHTML(key,label){return`<div class="color-control"><label for="${key}">${label}</label><input id="${key}" data-color="${key}" type="color"></div>`}
function toggleHTML(key,label){return`<div class="toggle"><label>${label}</label><button type="button" class="switch" data-toggle="${key}" aria-label="${label}"><span></span></button></div>`}
function schedule(){cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}
function render(){const preview=$('preview'),bar=$('bar'),bubble=$('bubble'),tabs=[...bar.querySelectorAll('.tab')],count=tabs.length,curve=CURVES[state.easing]||CURVES.spring,dur=state.animateTabs?state.animationDuration:0;bar.style.width=`${Math.min(98,state.barWidth)}%`;bar.style.height=`${state.barHeight}px`;bar.style.left='50%';bar.style.bottom=`${Math.max(2,state.bottomOffset)}px`;bar.style.padding=`${state.barPadding}px`;bar.style.borderRadius=`${state.barRadius}px`;bar.style.transform=`translateX(calc(-50% + ${state.barX}px))`;bar.style.gridTemplateColumns=`repeat(${count},minmax(0,1fr))`;bar.style.background=rgba(state.barColor,state.barOpacity);bar.style.border=`${state.barBorderWidth}px solid ${rgba(state.barBorderColor,state.barBorderOpacity)}`;bar.style.backdropFilter=`blur(${state.blur}px) saturate(${state.saturation}%) brightness(${state.brightness}%)`;bar.style.webkitBackdropFilter=bar.style.backdropFilter;bar.style.boxShadow=`0 ${state.shadowY}px ${state.shadowBlur}px ${state.shadowSpread}px ${rgba(state.shadowColor,state.shadowOpacity)}`;requestAnimationFrame(()=>{const innerW=Math.max(0,bar.clientWidth-state.barPadding*2),innerH=Math.max(0,bar.clientHeight-state.barPadding*2),cell=innerW/count,w=cell*state.bubbleWidth,h=innerH*state.bubbleHeight,left=state.barPadding+selected*cell+(cell-w)/2+state.bubbleX,top=state.barPadding+(innerH-h)/2+state.bubbleY;bubble.style.left=`${left}px`;bubble.style.top=`${top}px`;bubble.style.width=`${w}px`;bubble.style.height=`${h}px`;bubble.style.borderRadius=`${state.bubbleRadius}px`;bubble.style.background=rgba(state.bubbleColor,state.bubbleOpacity);bubble.style.border=`${state.bubbleBorderWidth}px solid ${rgba(state.bubbleBorderColor,state.bubbleBorderOpacity)}`;bubble.style.boxShadow=`0 ${state.bubbleShadowY}px ${state.bubbleShadowBlur}px ${rgba('#000000',state.bubbleShadowOpacity)}`;bubble.style.transition=`left ${dur}ms ${curve},top ${dur}ms ${curve},width ${dur}ms ${curve},height ${dur}ms ${curve}`});tabs.forEach((t,i)=>{const active=i===selected,span=t.querySelector('span'),small=t.querySelector('small');t.style.color=active?state.activeColor:state.inactiveColor;t.style.opacity=String(active?1:state.inactiveOpacity);t.style.gap=state.hideLabels?'0':`${state.itemGap}px`;span.style.width=`${state.iconSize}px`;span.style.height=`${state.iconSize}px`;span.style.transform=`translateY(${state.iconY}px) scale(${active?state.activeScale:1})`;span.style.transition=`transform ${dur}ms ${curve}`;small.style.display=state.hideLabels?'none':'block';small.style.fontSize=`${state.textSize}px`;small.style.fontWeight=String(state.textWeight)});Object.entries(groups).flatMap(([,d])=>d).forEach(([key,,,,unit])=>{const v=$(`v-${key}`);if(v)v.textContent=`${state[key]}${unit}`});$('code').value=JSON.stringify({format:'registro-tabbar-config-v2',theme,config:state},null,2)}
function apply(){const s=settings();s.tabBarStyles=s.tabBarStyles||{};s.tabBarStyles[theme]={...state};s.hideTabLabels=!!state.hideLabels;s.tabBarPresetVersion=PRESET;localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));toast(`Barra ${theme==='dark'?'escura':'clara'} salva`)}
function back(){if(document.referrer&&new URL(document.referrer).origin===location.origin)history.back();else location.href='./index.html'}
$('themeBtn').onclick=()=>loadFromApp(theme==='dark'?'light':'dark');$('reloadBtn').onclick=()=>loadFromApp(theme);$('applyBtn').onclick=apply;$('applyBackBtn').onclick=()=>{apply();setTimeout(back,120)};$('resetBtn').onclick=()=>{state={...base()};buildControls();render();toast('Padrão restaurado na prévia')};$('copyBtn').onclick=async()=>{try{await navigator.clipboard.writeText($('code').value);toast('Código copiado')}catch{$('code').select();document.execCommand('copy');toast('Código selecionado')}};$('backBtn').onclick=back;
window.addEventListener('pageshow',()=>{document.body.classList.toggle('dark',theme==='dark')});
loadFromApp(currentTheme());
</script>
</body>
</html>
