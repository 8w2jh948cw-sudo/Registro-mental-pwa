<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Editar barra inferior</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--surface:rgba(255,255,255,.94);--text:#111;--line:rgba(60,60,67,.18);--accent:#3478f6}@media(prefers-color-scheme:dark){:root{--bg:#000;--surface:rgba(28,28,30,.94);--text:#f5f5f7;--line:rgba(84,84,88,.55)}}*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif;color:var(--text)}body{display:grid;grid-template-rows:minmax(0,1fr) auto;overflow:hidden}.frame{width:100%;height:100%;border:0;background:var(--bg)}.dock{z-index:200;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr;gap:8px;background:var(--surface);border-top:1px solid var(--line);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%)}button{border:0;border-radius:14px;padding:12px 14px;font:700 14px/1 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}.back{background:rgba(120,120,128,.14);color:var(--text)}.apply{background:var(--accent);color:white}.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translate(-50%,10px);opacity:0;background:#1c1c1e;color:#fff;padding:9px 12px;border-radius:12px;font-size:12px;transition:.2s;pointer-events:none;z-index:300}.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<iframe class="frame" id="lab" src="./tabbar-lab.html?v=0.4.8" title="Laboratório da barra inferior"></iframe>
<div class="dock"><button class="back" id="back">Voltar</button><button class="apply" id="apply">Aplicar ao app</button></div>
<div class="toast" id="toast">Salvo</div>
<script>
const SETTINGS_KEY='registro-settings-v2';
const DARK_DEFAULT={barWidth:95,barHeight:52,bottomOffset:10,barPadding:1,barRadius:80,barX:0,barOpacity:.11,barColor:'#ffffff',blur:2,saturation:260,brightness:105,barBorderWidth:.5,barBorderOpacity:.12,barBorderColor:'#ffffff',shadowOpacity:.19,shadowBlur:16,shadowY:8,shadowSpread:2,shadowColor:'#000000',bubbleWidth:.99,bubbleHeight:.99,bubbleX:0,bubbleY:0,bubbleOpacity:.5,bubbleColor:'#adadad',bubbleRadius:80,bubbleBorderWidth:1.25,bubbleBorderOpacity:.15,bubbleBorderColor:'#ffffff',bubbleShadowOpacity:.14,bubbleShadowBlur:10,bubbleShadowY:-1,iconSize:31,activeScale:1.32,iconY:-1,textSize:8,textWeight:650,itemGap:1,hideLabels:true,activeColor:'#000000',inactiveColor:'#ffffff',animateTabs:true,animationDuration:740,easing:'spring',pressScale:1,inactiveOpacity:.48,theme:'dark'};
const LIGHT_DEFAULT={...DARK_DEFAULT,barWidth:95,barHeight:52,bottomOffset:10,barPadding:1,barRadius:80,barX:0,barOpacity:.11,barColor:'#ffffff',blur:2,saturation:260,brightness:105,barBorderWidth:.5,barBorderOpacity:.12,barBorderColor:'#ffffff',shadowOpacity:.19,shadowBlur:16,shadowY:8,shadowSpread:2,shadowColor:'#000000',bubbleWidth:.99,bubbleHeight:.99,bubbleX:0,bubbleY:0,bubbleOpacity:.25,bubbleColor:'#74a7ff',bubbleRadius:80,bubbleBorderWidth:1.25,bubbleBorderOpacity:.15,bubbleBorderColor:'#ffffff',bubbleShadowOpacity:.14,bubbleShadowBlur:10,bubbleShadowY:-1,iconSize:28,activeScale:1.32,iconY:-1,textSize:8,textWeight:650,itemGap:1,hideLabels:true,activeColor:'#000000',inactiveColor:'#000000',animateTabs:true,animationDuration:350,easing:'spring',pressScale:.78,inactiveOpacity:.61,theme:'light'};
function settings(){try{return JSON.parse(localStorage.getItem(SETTINGS_KEY)||'{}')}catch{return{}}}function saveSettings(s){localStorage.setItem(SETTINGS_KEY,JSON.stringify(s))}function base(theme){return theme==='dark'?DARK_DEFAULT:LIGHT_DEFAULT}function effectiveTheme(s){if(s.theme==='dark'||s.theme==='light')return s.theme;return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'}
function cleanConfig(raw,theme){const out={...base(theme),...raw,theme};delete out.selected;return out}
function loadIntoLab(theme){const win=document.getElementById('lab').contentWindow;if(!win?.state||!win?.render)return;const s=settings(),stored=s.tabBarDrafts?.[theme]||s.tabBarStyles?.[theme]||{};Object.assign(win.state,base(theme),stored,{theme,selected:Math.min(Number(win.state.selected)||0,4)});win.render()}
const frame=document.getElementById('lab');frame.addEventListener('load',()=>{const win=frame.contentWindow;if(!win?.state||!win?.render)return;loadIntoLab(effectiveTheme(settings()));const btn=win.document.getElementById('themeBtn');if(btn){btn.onclick=()=>{const before=win.state.theme==='light'?'light':'dark',after=before==='dark'?'light':'dark',s=settings();s.tabBarDrafts=s.tabBarDrafts||{};s.tabBarDrafts[before]=cleanConfig({...win.state},before);saveSettings(s);loadIntoLab(after)}}});
document.getElementById('apply').onclick=()=>{const win=frame.contentWindow;if(!win?.state)return;const theme=win.state.theme==='light'?'light':'dark',cfg=cleanConfig({...win.state},theme),s=settings();s.tabBarStyles=s.tabBarStyles||{};s.tabBarStyles[theme]=cfg;s.hideTabLabels=Boolean(cfg.hideLabels);if(s.tabBarDrafts)delete s.tabBarDrafts[theme];saveSettings(s);const t=document.getElementById('toast');t.textContent=`Barra ${theme==='dark'?'escura':'clara'} salva`;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1300)};
document.getElementById('back').onclick=()=>location.href='./index.html';
</script>
</body>
</html>
