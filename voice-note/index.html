<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#f5f5f7">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Anotar por Voz">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://api.openai.com; img-src 'self' data:; media-src 'self' blob:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none';">
<title>Anotar por Voz</title>
<style>
:root{color-scheme:light dark;--bg:#f5f5f7;--card:#fff;--text:#111114;--muted:#6e6e73;--line:rgba(60,60,67,.14);--accent:#34c759;--accent2:#30b350;--danger:#ff3b30;--shadow:0 10px 30px rgba(0,0,0,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--text:#f5f5f7;--muted:#98989d;--line:rgba(235,235,245,.14);--shadow:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--text)}body{min-height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 24px);display:flex;justify-content:center}.app{width:100%;max-width:480px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}h1{font-size:28px;line-height:1.05;letter-spacing:-.7px;margin:0;font-weight:750}.icon-btn{width:42px;height:42px;border:0;border-radius:14px;background:var(--card);color:var(--text);display:grid;place-items:center;box-shadow:var(--shadow)}.card{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:22px;box-shadow:var(--shadow)}.recorder{min-height:410px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.status{font-size:17px;font-weight:650;min-height:24px;margin:0 0 5px}.detail{font-size:13px;color:var(--muted);min-height:20px;margin:0 0 23px}.mic{width:146px;height:146px;border-radius:50%;border:0;background:linear-gradient(180deg,var(--accent),var(--accent2));display:grid;place-items:center;color:white;box-shadow:0 16px 40px rgba(52,199,89,.28);transition:transform .15s}.mic:active{transform:scale(.97)}.mic.recording{background:linear-gradient(180deg,#ff453a,#e6332a);box-shadow:0 16px 40px rgba(255,59,48,.28)}.mic svg{width:58px;height:58px}.meter{width:82%;height:8px;background:var(--line);border-radius:999px;overflow:hidden;margin:26px 0 12px}.meter>div{height:100%;width:0;background:var(--accent);border-radius:999px;transition:width .08s linear}.timer{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px;min-height:20px}.actions{display:flex;gap:10px;width:100%;margin-top:22px}.btn{appearance:none;border:0;border-radius:16px;padding:14px 16px;font-size:16px;font-weight:650;background:var(--text);color:var(--bg);flex:1}.btn.secondary{background:var(--line);color:var(--text)}.btn.danger{background:rgba(255,59,48,.12);color:var(--danger)}.hidden{display:none!important}.transcript{margin-top:14px;padding:15px 16px;border-radius:18px;background:var(--card);border:1px solid var(--line);font-size:14px;line-height:1.45;white-space:pre-wrap;word-break:break-word}.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.34);display:flex;align-items:flex-end;justify-content:center;z-index:10}.sheet{width:100%;max-width:520px;max-height:88dvh;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:20px 18px calc(env(safe-area-inset-bottom) + 20px)}.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet h2{font-size:23px;margin:0}.close{border:0;background:var(--line);color:var(--text);width:34px;height:34px;border-radius:50%;font-size:20px}.group{background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:14px}.field{padding:14px 15px;border-bottom:1px solid var(--line)}.field:last-child{border-bottom:0}label{display:block;font-size:12px;font-weight:650;color:var(--muted);margin-bottom:7px;text-transform:uppercase;letter-spacing:.3px}input,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:transparent;border:0;outline:0;padding:3px 0}.range-row{display:flex;align-items:center;gap:12px}.range-row input{flex:1}.value{font-variant-numeric:tabular-nums;min-width:38px;text-align:right}.check{display:flex;align-items:center;gap:10px;font-size:15px}.check input{width:20px;height:20px}.note{font-size:12px;color:var(--muted);line-height:1.4;margin:8px 2px 16px}.error{color:var(--danger)!important}.ok{color:var(--accent)!important}
</style>
</head>
<body>
<main class="app">
<div class="top"><h1>Anotar por Voz</h1><button id="settingsBtn" class="icon-btn" aria-label="Ajustes"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.15.38.38.73.7 1 .31.27.7.4 1.1.4H21v4h-.09a1.7 1.7 0 0 0-1.51.6z"></path></svg></button></div>
<section class="card recorder">
<p id="status" class="status">Pronto para anotar</p><p id="detail" class="detail">Toque no microfone e fale normalmente.</p>
<button id="micBtn" class="mic" aria-label="Iniciar gravação"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0M12 17v5M8 22h8"></path></svg></button>
<div class="meter"><div id="meterFill"></div></div><div id="timer" class="timer">Parada automática após 4 s de silêncio</div>
<div id="recordActions" class="actions hidden"><button id="stopBtn" class="btn danger">Parar agora</button></div>
<div id="retryActions" class="actions hidden"><button id="retryBtn" class="btn secondary">Gravar de novo</button><button id="sendBtn" class="btn">Enviar à nota</button></div>
</section><div id="transcript" class="transcript hidden"></div>
</main>
<div id="settingsWrap" class="sheet-wrap hidden" role="dialog" aria-modal="true"><section class="sheet"><div class="sheet-head"><h2>Ajustes</h2><button id="closeSettings" class="close">×</button></div>
<div class="group"><div class="field"><label for="apiKey">Chave da API OpenAI</label><input id="apiKey" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="sk-…"></div><div class="field"><div class="check"><input id="rememberKey" type="checkbox"><span>Lembrar chave neste dispositivo</span></div></div></div>
<p class="note">Por segurança, a chave fica apenas nesta sessão se você não marcar “Lembrar”. Ela nunca é colocada no código do GitHub.</p>
<div class="group"><div class="field"><label for="shortcutName">Nome exato do atalho</label><input id="shortcutName" type="text" value="Anotar por Voz"></div><div class="field"><label for="silenceRange">Tempo de silêncio</label><div class="range-row"><input id="silenceRange" type="range" min="2" max="8" step="0.5" value="4"><span id="silenceValue" class="value">4 s</span></div></div><div class="field"><label for="sensitivity">Sensibilidade à voz</label><select id="sensitivity"><option value="high">Alta</option><option value="normal" selected>Normal</option><option value="low">Baixa / ambiente ruidoso</option></select></div><div class="field"><label for="model">Modelo de transcrição</label><select id="model"><option value="gpt-transcribe" selected>GPT Transcribe</option><option value="gpt-4o-mini-transcribe">GPT-4o mini Transcribe</option></select></div></div>
<button id="saveSettings" class="btn">Salvar ajustes</button><p id="settingsMessage" class="note"></p></section></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),E={status:$('status'),detail:$('detail'),mic:$('micBtn'),meter:$('meterFill'),timer:$('timer'),recA:$('recordActions'),retryA:$('retryActions'),stop:$('stopBtn'),retry:$('retryBtn'),send:$('sendBtn'),trans:$('transcript'),wrap:$('settingsWrap'),settings:$('settingsBtn'),close:$('closeSettings'),key:$('apiKey'),remember:$('rememberKey'),shortcut:$('shortcutName'),silence:$('silenceRange'),silVal:$('silenceValue'),sens:$('sensitivity'),model:$('model'),save:$('saveSettings'),msg:$('settingsMessage')};
const L={shortcut:'voiceNote.shortcutName',silence:'voiceNote.silenceSeconds',sens:'voiceNote.sensitivity',model:'voiceNote.model',key:'voiceNote.apiKey'},S='voiceNote.apiKey.session';let stream=null,rec=null,chunks=[],ctx=null,an=null,raf=0,start=0,last=0,lastVoice=0,voiceAccum=0,voiceSeen=false,noise=.008,blob=null,text='',stopping=false;
const apiKey=()=>((localStorage.getItem(L.key)||sessionStorage.getItem(S)||'').trim());const sec=n=>Number.isInteger(n)?`${n} s`:`${String(n).replace('.',',')} s`;
function load(){E.shortcut.value=localStorage.getItem(L.shortcut)||'Anotar por Voz';E.silence.value=localStorage.getItem(L.silence)||'4';E.sens.value=localStorage.getItem(L.sens)||'normal';E.model.value=localStorage.getItem(L.model)||'gpt-transcribe';E.silVal.textContent=`${E.silence.value} s`;const p=localStorage.getItem(L.key),s=sessionStorage.getItem(S);if(p){E.key.value=p;E.remember.checked=true}else if(s)E.key.value=s;ready()}
function save(){const k=E.key.value.trim();localStorage.setItem(L.shortcut,E.shortcut.value.trim()||'Anotar por Voz');localStorage.setItem(L.silence,E.silence.value);localStorage.setItem(L.sens,E.sens.value);localStorage.setItem(L.model,E.model.value);if(k){if(E.remember.checked){localStorage.setItem(L.key,k);sessionStorage.removeItem(S)}else{sessionStorage.setItem(S,k);localStorage.removeItem(L.key)}}else{sessionStorage.removeItem(S);localStorage.removeItem(L.key)}E.msg.textContent=k?'Ajustes salvos.':'Informe sua chave da API antes de gravar.';E.msg.className=`note ${k?'ok':'error'}`;ready();if(k)setTimeout(close,450)}
function open(m=''){const k=apiKey();if(k)E.key.value=k;E.msg.textContent=m;E.msg.className=`note ${m?'error':''}`;E.wrap.classList.remove('hidden')}function close(){E.wrap.classList.add('hidden')}
function ready(){clearErr();const s=Number(localStorage.getItem(L.silence)||E.silence.value||4);E.status.textContent='Pronto para anotar';E.detail.textContent='Toque no microfone e fale normalmente.';E.timer.textContent=`Parada automática após ${sec(s)} de silêncio`;E.mic.classList.remove('recording');E.recA.classList.add('hidden');E.retryA.classList.add('hidden');E.send.classList.remove('hidden');E.meter.style.width='0%'}
function mime(){return['audio/mp4;codecs=mp4a.40.2','audio/mp4','audio/webm;codecs=opus','audio/webm'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||''}function cfg(){const m=localStorage.getItem(L.sens)||E.sens.value||'normal';return m==='high'?{f:1.5,o:.003,min:.010}:m==='low'?{f:2.25,o:.006,min:.016}:{f:1.8,o:.004,min:.012}}
async function begin(){if(!apiKey()){open('Cole sua chave da API OpenAI para continuar.');return}if(!navigator.mediaDevices?.getUserMedia||!window.MediaRecorder){err('Abra esta página pelo Safari no iPhone.');return}try{cleanup();blob=null;text='';chunks=[];stopping=false;E.trans.classList.add('hidden');E.retryA.classList.add('hidden');stream=await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,echoCancellation:true,noiseSuppression:true,autoGainControl:true}});ctx=new(window.AudioContext||window.webkitAudioContext)();await ctx.resume();const src=ctx.createMediaStreamSource(stream);an=ctx.createAnalyser();an.fftSize=2048;an.smoothingTimeConstant=.15;src.connect(an);const m=mime();rec=m?new MediaRecorder(stream,{mimeType:m,audioBitsPerSecond:64000}):new MediaRecorder(stream,{audioBitsPerSecond:64000});rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};rec.onerror=()=>err('Falha durante a gravação.');rec.onstop=stopped;rec.start(250);start=performance.now();last=start;lastVoice=0;voiceAccum=0;voiceSeen=false;noise=.008;E.status.textContent='Ouvindo…';E.detail.textContent='Comece a falar. A pausa longa encerra sozinha.';E.mic.classList.add('recording');E.recA.classList.remove('hidden');monitor()}catch(x){cleanup();err(String(x?.name).includes('NotAllowed')?'Permissão do microfone negada. Libere o microfone para esta página no Safari.':`Não consegui iniciar o microfone: ${x?.message||x}`)}}
function monitor(){if(!an||!rec||rec.state!=='recording')return;const d=new Float32Array(an.fftSize);an.getFloatTimeDomainData(d);let sum=0;for(const v of d)sum+=v*v;const rms=Math.sqrt(sum/d.length),now=performance.now(),dt=Math.max(0,now-last);last=now;const c=cfg(),thr=Math.max(c.min,Math.min(.060,noise*c.f+c.o)),isVoice=rms>thr;if(!voiceSeen){if(isVoice){voiceAccum+=dt;if(voiceAccum>=120){voiceSeen=true;lastVoice=now;E.detail.textContent='Voz detectada. Continue falando normalmente.'}}else{voiceAccum=0;noise=Math.min(.030,noise*.94+rms*.06)}}else{if(isVoice)lastVoice=now;else noise=Math.min(.030,noise*.995+rms*.005);const s=Number(localStorage.getItem(L.silence)||4),q=(now-lastVoice)/1000,left=Math.max(0,s-q);E.detail.textContent=q>.35?`Pausa detectada · encerrando em ${left.toFixed(1).replace('.',',')} s`:'Voz detectada. Continue falando normalmente.';if(q>=s){stop('silence');return}}const level=Math.max(0,Math.min(100,rms/Math.max(thr*2.2,.04)*100));E.meter.style.width=`${level}%`;const elapsed=(now-start)/1000;E.timer.textContent=`Gravando · ${elapsed.toFixed(1).replace('.',',')} s`;if(elapsed>=300){stop('limit');return}raf=requestAnimationFrame(monitor)}
function stop(reason='manual'){if(stopping||!rec||rec.state==='inactive')return;stopping=true;cancelAnimationFrame(raf);E.recA.classList.add('hidden');E.status.textContent=reason==='silence'?'Pausa detectada':'Finalizando gravação…';E.detail.textContent='Preparando o áudio.';try{rec.stop()}catch(_){}}
async function stopped(){const m=rec?.mimeType||mime()||'audio/mp4';blob=new Blob(chunks,{type:m});cleanup();if(!blob.size){err('A gravação ficou vazia. Tente novamente.');return}await transcribe()}
async function transcribe(){const k=apiKey();if(!k){open('A chave da API não está disponível nesta sessão.');return}try{E.status.textContent='Transcrevendo…';E.detail.textContent='Enviando somente este áudio para a OpenAI.';E.timer.textContent='';E.meter.style.width='100%';const m=blob.type||'audio/mp4',ext=m.includes('webm')?'webm':'m4a',form=new FormData();form.append('file',blob,`anotacao.${ext}`);form.append('model',localStorage.getItem(L.model)||'gpt-transcribe');form.append('language','pt');const r=await fetch('https://api.openai.com/v1/audio/transcriptions',{method:'POST',headers:{Authorization:`Bearer ${k}`},body:form});let data=null;try{data=await r.json()}catch(_){}if(!r.ok)throw new Error(data?.error?.message||`Erro HTTP ${r.status}`);text=(data?.text||'').trim();if(!text)throw new Error('A OpenAI não retornou texto.');E.trans.textContent=text;E.trans.classList.remove('hidden');E.status.textContent='Transcrição pronta';E.detail.textContent='Abrindo o Atalhos para salvar na nota…';E.meter.style.width='0%';launch(text);setTimeout(()=>{if(!document.hidden){E.retryA.classList.remove('hidden');E.send.textContent='Enviar à nota';E.detail.textContent='Se o Atalhos não abriu sozinho, toque em “Enviar à nota”.'}},1400)}catch(x){E.retryA.classList.remove('hidden');E.send.classList.add('hidden');err(`Falha na transcrição: ${x?.message||x}`)}}
function launch(t){const n=localStorage.getItem(L.shortcut)||'Anotar por Voz';location.href=`shortcuts://run-shortcut?name=${encodeURIComponent(n)}&input=text&text=${encodeURIComponent(t)}`}
function err(m){E.status.textContent='Não foi possível concluir';E.status.classList.add('error');E.detail.textContent=m;E.detail.classList.add('error');E.recA.classList.add('hidden')}function clearErr(){E.status.classList.remove('error');E.detail.classList.remove('error')}
function cleanup(){cancelAnimationFrame(raf);if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}if(ctx){try{ctx.close()}catch(_){}ctx=null}an=null}
E.mic.onclick=()=>{clearErr();rec&&rec.state==='recording'?stop('manual'):begin()};E.stop.onclick=()=>stop('manual');E.retry.onclick=()=>{ready();begin()};E.send.onclick=()=>{if(text)launch(text)};E.settings.onclick=()=>open();E.close.onclick=close;E.wrap.onclick=e=>{if(e.target===E.wrap)close()};E.save.onclick=save;E.silence.oninput=()=>E.silVal.textContent=`${E.silence.value.replace('.',',')} s`;document.addEventListener('visibilitychange',()=>{if(document.hidden&&rec?.state==='recording')E.detail.textContent='Mantenha esta tela aberta para a parada automática funcionar.'});load();if(!apiKey())setTimeout(()=>open('Cole sua chave da API OpenAI uma vez para começar.'),300)})();
</script>
</body></html>
